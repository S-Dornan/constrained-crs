#cloud-config
hostname: crs-cleanroom
fqdn: crs-cleanroom.local
package_update: true
package_upgrade: false

users:
  - name: ubuntu
    groups: sudo, docker
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL

# Unlock the console by setting a default password
chpasswd:
  list: |
    ubuntu:changeme
  expire: false

packages:
  - qemu-guest-agent
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - htop
  - python3
  - python3-pip
  - tmux

write_files:
  - path: /etc/default/grub.d/99-custom-timeout.cfg
    content: |
      GRUB_TIMEOUT=5
      GRUB_TIMEOUT_STYLE=menu

  # 1. System-wide Proxy Environment Variables
  - path: /etc/environment
    append: true
    content: |
      http_proxy="http://172.16.255.20:3128"
      https_proxy="http://172.16.255.20:3128"
      HTTP_PROXY="http://172.16.255.20:3128"
      HTTPS_PROXY="http://172.16.255.20:3128"
      no_proxy="localhost,127.0.0.1,172.16.255.21,172.16.255.20"

  # 2. Apt-Specific Proxy Settings
  - path: /etc/apt/apt.conf.d/01proxy
    content: |
      Acquire::http::Proxy "http://172.16.255.20:3128";
      Acquire::https::Proxy "http://172.16.255.20:3128";

  # 3. Docker Daemon Proxy Settings
  - path: /etc/systemd/system/docker.service.d/http-proxy.conf
    content: |
      [Service]
      Environment="HTTP_PROXY=http://172.16.255.20:3128"
      Environment="HTTPS_PROXY=http://172.16.255.20:3128"
      Environment="NO_PROXY=localhost,127.0.0.1,172.16.255.21,172.16.255.20"

runcmd:
  # Wait for the Log Vault (VM 301) Squid proxy to come online before proceeding
  - "while ! bash -c 'echo > /dev/tcp/172.16.255.20/3128' 2>/dev/null; do sleep 5; done"

  # Enable QEMU
  - systemctl enable --now qemu-guest-agent

  # Enable explicit cgroups v2 with cpuset for strict docker isolation
  - sed -i 's/GRUB_CMDLINE_LINUX_DEFAULT="/GRUB_CMDLINE_LINUX_DEFAULT="systemd.unified_cgroup_hierarchy=1 cgroup_enable=cpuset cgroup_memory=1 cgroup_enable=memory /g' /etc/default/grub
  - update-grub
  
  # Install Docker (Bulletproofed with dpkg wait loop)
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
  - "while fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock /var/lib/dpkg/lock >/dev/null 2>&1; do sleep 5; done"
  - dpkg --configure -a || true
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  
  # Reload systemd to catch the Docker proxy drop-in, then enable Docker
  - systemctl daemon-reload
  - systemctl enable --now docker
  - systemctl restart docker

  # Install UV and Just (Traffic goes through the proxy defined in /etc/environment)
  - sudo -u ubuntu bash -c 'export http_proxy="http://172.16.255.20:3128" https_proxy="http://172.16.255.20:3128"; curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR="/home/ubuntu/.local/bin" sh'
  - sudo -u ubuntu bash -c 'export http_proxy="http://172.16.255.20:3128" https_proxy="http://172.16.255.20:3128"; curl --proto "=https" --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to /home/ubuntu/.local/bin'

  # Clone Repositories First (Git respects the exported proxies)
  - sudo -u ubuntu bash -c 'export http_proxy="http://172.16.255.20:3128" https_proxy="http://172.16.255.20:3128"; git clone https://github.com/sslab-gatech/CRSBench.git /home/ubuntu/CRSBench'
  - sudo -u ubuntu bash -c 'export http_proxy="http://172.16.255.20:3128" https_proxy="http://172.16.255.20:3128"; git clone https://github.com/ossf/oss-crs.git /home/ubuntu/CRSBench/oss-crs'
  - sudo -u ubuntu bash -c 'export http_proxy="http://172.16.255.20:3128" https_proxy="http://172.16.255.20:3128"; git clone --depth 1 https://github.com/Team-Atlanta/atlantis-java.git /tmp/atlantis-java'

  # Write the API keys AFTER the clone
  - |
    sudo -u ubuntu bash -c 'cat <<EOF > /home/ubuntu/CRSBench/.env
    CRSBENCH_LLM_UPSTREAM_BASE_URL=__BASE_URL__
    CRSBENCH_LLM_UPSTREAM_API_KEY=__GEMINI_API_KEY__
    EOF'
  - chmod 0600 /home/ubuntu/CRSBench/.env

  # Bootstrap the Environment
  - sudo -u ubuntu bash -c 'export http_proxy="http://172.16.255.20:3128" https_proxy="http://172.16.255.20:3128"; /home/ubuntu/.local/bin/uv sync --project /home/ubuntu/CRSBench'

final_message: "Cleanroom provisioned securely via Log Vault proxy after $UPTIME seconds."