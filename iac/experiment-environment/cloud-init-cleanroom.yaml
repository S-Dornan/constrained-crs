#cloud-config
package_update: true
package_upgrade: true

users:
  - name: ubuntu
    groups: sudo, docker
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL

# Unlock the console by setting a default password
chpasswd:
  list: |
    ubuntu:changeme
  expire: false

packages:
  - qemu-guest-agent
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - htop
  - python3
  - python3-pip
  - tmux

write_files:
  - path: /etc/default/grub.d/99-custom-timeout.cfg
    content: |
      GRUB_TIMEOUT=5
      GRUB_TIMEOUT_STYLE=menu

runcmd:
  - systemctl enable --now qemu-guest-agent
  - update-grub
  
  # Install Docker
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker

  # Install UV and Just
  - sudo -u ubuntu curl -LsSf https://astral.sh/uv/install.sh | sudo -u ubuntu env UV_INSTALL_DIR="/home/ubuntu/.local/bin" sh
  - curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin

  # Clone Repositories First
  - sudo -u ubuntu git clone https://github.com/sslab-gatech/CRSBench.git /home/ubuntu/CRSBench
  - sudo -u ubuntu git clone https://github.com/ossf/oss-crs.git /home/ubuntu/oss-crs
  - sudo -u ubuntu git clone --depth 1 https://github.com/Team-Atlanta/atlantis-java.git /tmp/atlantis-java

  # Write the API keys AFTER the clone
  - |
    sudo -u ubuntu bash -c 'cat <<EOF > /home/ubuntu/CRSBench/.env
    CRSBENCH_LLM_UPSTREAM_BASE_URL=https://api.openai.com/v1
    CRSBENCH_LLM_UPSTREAM_API_KEY=YOUR_GEMINI_API_KEY_HERE
    EOF'
  - chmod 0600 /home/ubuntu/CRSBench/.env

  # Bootstrap the Environment
  - sudo -u ubuntu /home/ubuntu/.local/bin/uv sync --project /home/ubuntu/CRSBench

final_message: "Cleanroom provisioned successfully after $UPTIME seconds."