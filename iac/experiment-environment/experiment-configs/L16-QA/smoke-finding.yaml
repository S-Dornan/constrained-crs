experiment:
  name: smoke-phase1-finding
  task: bugfinding
  mode: full
  benchmark_suite: smoke/sanity
  sanitizers: [address]

runtime:
  trials: 1
  max_total_time: 1800     # 30 minutes total ceiling
  build_timeout: 900       # 15 minutes allowed for build
  run_timeout: 600         # 10 minutes for active fuzzing
  verify_timeout: 300      # 5 minutes for verification
  redis_host: localhost:6379
  litellm:
    skip: true

storage:
  experiment_filestore: ./results/experiment-data
  report_filestore: ./results/report-data

crs_compose:
  atlantis-multilang-given_fuzzer:
    num_cores: 2

worker:
  jobs: 1
  cores_per_job: 2

evaluator:
  jobs: 1
  cores_per_job: 2