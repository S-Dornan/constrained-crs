#cloud-config
hostname: crs-log-vault
fqdn: crs-log-vault.local
package_update: true
package_upgrade: false

users:
  - name: ubuntu
    groups: sudo, docker
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - __SYNC_PUB_KEY__

chpasswd:
  list: |
    ubuntu:changeme
  expire: false

packages:
  - qemu-guest-agent
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - htop
  - squid
  - rclone

write_files:
  # 1. Configure the telemetry logging service
  - path: /etc/systemd/system/serial-logger.service
    content: |
      [Unit]
      Description=Record telemetry from Cleanroom via ttyS1
      After=multi-user.target

      [Service]
      Type=simple
      User=root
      ExecStartPre=/bin/touch /home/ubuntu/experiment-telemetry.log
      ExecStartPre=/bin/chown ubuntu:ubuntu /home/ubuntu/experiment-telemetry.log
      ExecStartPre=/bin/chmod 666 /dev/ttyS1
      ExecStart=/bin/sh -c 'stty -F /dev/ttyS1 115200 raw -echo && cat /dev/ttyS1 >> /home/ubuntu/experiment-telemetry.log'
      Restart=always
      RestartSec=2

      [Install]
      WantedBy=multi-user.target

  # 2. Configure Squid to cache heavy assets locally over the backplane
  - path: /etc/squid/squid.conf
    content: |
      # Listen strictly on the internal backplane interface
      http_port 172.16.255.20:3128

      # Define the Cleanroom subnet and allow access
      acl backplane src 172.16.255.0/24
      http_access allow backplane
      http_access deny all

      # Fatten the cache: 10GB storage, max object size 5GB (for Docker layers)
      cache_dir ufs /var/spool/squid 10000 16 256
      maximum_object_size 5000 MB
      cache_mem 1024 MB

      # Standard refresh patterns to maximize cache hits
      refresh_pattern ^ftp:           1440    20%     10080
      refresh_pattern ^gopher:        1440    0%      1440
      refresh_pattern -i (/cgi-bin/|\?) 0     0%      0
      refresh_pattern .               0       20%     4320
  
  # 3. Provision the Uptime Kuma Dual-Monitor Stack
  - path: /home/ubuntu/monitors/docker-compose.yml
    content: |
      services:
        health-monitor:
          image: ghcr.io/s-dornan/pve-push-monitor:latest
          container_name: uptime-kuma-health
          restart: always
          environment:
            - MONITOR_TYPE=health
            - PUSH_URL=${HEALTH_PUSH_URL}
            - PUSH_INTERVAL=${PUSH_INTERVAL}
            - CF_CLIENT_ID=${CF_CLIENT_ID}
            - CF_CLIENT_SECRET=${CF_CLIENT_SECRET}

        stream-monitor:
          image: ghcr.io/s-dornan/pve-push-monitor:latest
          container_name: uptime-kuma-stream
          restart: always
          environment:
            - MONITOR_TYPE=stream
            - LOG_FILE=${LOG_FILE}
            - PUSH_URL=${STREAM_PUSH_URL}
            - PUSH_INTERVAL=${PUSH_INTERVAL}
            - CF_CLIENT_ID=${CF_CLIENT_ID}
            - CF_CLIENT_SECRET=${CF_CLIENT_SECRET}
          volumes:
            - /home/ubuntu/experiment-telemetry.log:/var/log/experiment-telemetry.log:ro

  - path: /home/ubuntu/monitors/.env
    content: |
      LOG_FILE=__LOG_FILE__
      HEALTH_PUSH_URL=__HEALTH_URL__
      STREAM_PUSH_URL=__STREAM_URL__
      PUSH_INTERVAL=60
      CF_CLIENT_ID=__CF_ID__
      CF_CLIENT_SECRET=__CF_SECRET__

  # 4. Inject Rclone Configuration (Decoded dynamically on boot)
  - path: /root/.config/rclone/rclone.conf
    permissions: '0600'
    encoding: b64
    content: __RCLONE_CONF_B64__

  - path: /etc/cron.d/rclone-sync
    content: |
      */15 * * * * root rclone copy /home/ubuntu/vault-results/ "__RCLONE_REMOTE_PATH__" >> /var/log/rclone.log 2>&1

runcmd:
  # Enable QEMU Agent
  - systemctl enable --now qemu-guest-agent

  # Allow inbound access to Squid Proxy
  - iptables -I INPUT 1 -p tcp --dport 3128 -j ACCEPT

  
  # Install Docker Native (Bulletproofed with dpkg repair)
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --yes --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
  
  # Wait for locks, repair dpkg if interrupted by cloud-init upgrades, then install
  - "while fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock /var/lib/dpkg/lock >/dev/null 2>&1; do sleep 5; done"
  - dpkg --configure -a || true
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker

  # Enable and restart services to apply configurations (Squid cache built automatically)
  - systemctl enable --now serial-logger
  - systemctl restart squid

  # Grant ownership to the full Ubuntu folder
  - chown -R ubuntu:ubuntu /home/ubuntu
  
  # Spin up the Observability Stack
  - cd /home/ubuntu/monitors && docker compose pull && docker compose up -d --remove-orphans

final_message: "Log Vault provisioned securely with Docker and Squid after $UPTIME seconds."