#cloud-config
package_update: true
package_upgrade: true

users:
  - name: ubuntu
    groups: sudo, docker
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL

chpasswd:
  list: |
    ubuntu:changeme
  expire: false

packages:
  - qemu-guest-agent
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - htop
  - squid

write_files:
  # 1. Configure the telemetry logging service
  - path: /etc/systemd/system/serial-logger.service
    content: |
      [Unit]
      Description=Record telemetry from Cleanroom via ttyS1
      After=multi-user.target

      [Service]
      Type=simple
      User=root
      ExecStartPre=/bin/touch /home/ubuntu/experiment-telemetry.log
      ExecStartPre=/bin/chown ubuntu:ubuntu /home/ubuntu/experiment-telemetry.log
      ExecStartPre=/bin/chmod 666 /dev/ttyS1
      ExecStart=/bin/sh -c 'stty -F /dev/ttyS1 115200 raw -echo && cat /dev/ttyS1 >> /home/ubuntu/experiment-telemetry.log'
      Restart=always
      RestartSec=2

      [Install]
      WantedBy=multi-user.target

  # 2. Configure Squid to cache heavy assets locally over the backplane
  - path: /etc/squid/squid.conf
    content: |
      # Listen strictly on the internal backplane interface
      http_port 172.16.255.20:3128

      # Define the Cleanroom subnet and allow access
      acl backplane src 172.16.255.0/24
      http_access allow backplane
      http_access deny all

      # Fatten the cache: 10GB storage, max object size 5GB (for Docker layers)
      cache_dir ufs /var/spool/squid 10000 16 256
      maximum_object_size 5000 MB
      cache_mem 1024 MB

      # Standard refresh patterns to maximize cache hits
      refresh_pattern ^ftp:           1440    20%     10080
      refresh_pattern ^gopher:        1440    0%      1440
      refresh_pattern -i (/cgi-bin/|\?) 0     0%      0
      refresh_pattern .               0       20%     4320

runcmd:
  - systemctl enable --now qemu-guest-agent
  
  # Install Docker Native (Bulletproofed)
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --yes --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
  - "while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do sleep 5; done; apt-get update"
  - "while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do sleep 5; done; apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin"
  - systemctl enable --now docker

  # Initialize Squid cache directories before starting
  - squid -z
  - sleep 5
  
  # Enable and restart services to apply configurations
  - systemctl enable --now serial-logger
  - systemctl restart squid

final_message: "Log Vault provisioned securely with Docker and Squid after $UPTIME seconds."