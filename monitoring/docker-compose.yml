# docker-compose.yml
services:
  uptime-kuma-general:
    # Point this to your Gitea registry URL
    image: gitea.samdornan.me/underperforming-software/pi-monitor:online
    container_name: uptime-kuma-online
    restart: always
    devices:
      - /dev/vchiq:/dev/vchiq
      - /dev/vcio:/dev/vcio
    env_file:
      - .env
